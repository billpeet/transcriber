name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each push to main gets a unique, monotonically increasing version so
      # electron-updater always sees newer builds as updates.
      - name: Set build version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "Building version ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version

      # Pre-create the tag and published release so electron-builder only
      # ever uploads to an existing release. Letting electron-builder create
      # the release itself races between parallel asset uploads and can
      # produce duplicate releases with assets split across them.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Transcriber ${VERSION}" \
            --notes "Automated build from commit ${GITHUB_SHA}"

      - name: Build renderer & main process
        run: npm run build

      # Builds the NSIS installer and uploads it (plus latest.yml + blockmap,
      # used by electron-updater for update checks and differential downloads)
      # to the release created above.
      - name: Package & publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
