appId: com.billpeet.transcriber
productName: Transcriber

directories:
  buildResources: build
  output: release

files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/*.map"

# Binaries can't be executed from inside the asar archive
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
    - zip
  icon: build/icon-512.png
  category: public.app-category.productivity

linux:
  target:
    - AppImage
  icon: build/icon-256.png
  category: AudioVideo

# Auto-update feed — electron-updater reads this from app-update.yml at runtime
publish:
  provider: github
  owner: billpeet
  repo: transcriber
  releaseType: release
